name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Check data/tools.yml parses
        run: python3 -c "import yaml; yaml.safe_load(open('data/tools.yml')); print('tools.yml OK')"

      - name: Check data/tools.yml schema
        run: python3 scripts/check_schema.py

      - name: Check generated markdown is up to date
        run: python3 scripts/build.py --check

      - name: Check published entries are within the freshness rule
        run: python3 scripts/check_freshness.py
