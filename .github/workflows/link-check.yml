name: link-check

# Vendor pages move without warning, which is how the HeyGen and Grammarly
# articles rotted unnoticed for months. This runs monthly and opens an issue
# only when a link is genuinely broken, not when a help centre blocks the bot.

on:
  schedule:
    - cron: '0 9 1 * *'   # 09:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Check links
        id: check
        run: |
          set +e
          python3 scripts/check_links.py --md > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open an issue if any link is broken
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = `Broken links detected (${new Date().toISOString().slice(0, 10)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body + '\n\nFix the URL in `data/tools.yml`, then run `python3 scripts/build.py`.',
              labels: ['link-rot'],
            });
