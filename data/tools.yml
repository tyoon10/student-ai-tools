# ---------------------------------------------------------------------------
# No individual student offer. Documented so the question stays answered.
# ---------------------------------------------------------------------------
excluded:

  - id: claude
    name: Claude (Anthropic)
    status: institutional
    published: true
    reason: >-
      No individual student discount on consumer pricing. Anthropic does not issue
      one-off discounts or coupons for Pro.
    detail: >-
      Access for students runs through Claude for Education, a university-wide plan
      licensed to the institution. Campus-wide agreements in place by mid-2026
      include Stanford, which rolled out to all students, faculty and staff from
      2026-06-30, plus Northeastern, the London School of Economics, Champlain
      College and Northumbria.
    individual_routes: >-
      Two routes are open to any student with a school email regardless of
      institution. Student Builder credits grant roughly 50 USD in Anthropic API
      credit, and the External Researcher Access Program grants around 1,000 USD in
      credit. Neither is a Pro subscription. Outside those, the cheapest official
      option is Pro on annual billing at 17 USD per month, billed 200 USD up front,
      against 20 USD billed monthly.
    check_path: Ask your IT or procurement team whether your campus holds a Claude for Education agreement.
    links:
      - 'https://claude.com/solutions/education'
      - 'https://claude.com/pricing'
    last_checked: '2026-08-18'
    confidence: high

  - id: gemini
    name: Google Gemini
    status: ended
    published: true
    ended_on: '2026-03-11'
    reason: >-
      The free year of Google AI Pro for students ended on 2026-03-11. The student
      page now reads "Our previous student offer ended on March 11, 2026 and is no
      longer available in your region."
    detail: >-
      This is the clearest example of the pattern the guide warns about. A generous
      student offer ran long enough to drive adoption and was then withdrawn.
    check_path: Monitor the student page for a regional relaunch.
    links:
      - 'https://gemini.google/students/'
    last_checked: '2026-08-18'
    confidence: high

  - id: microsoft-copilot
    name: Microsoft Copilot (Microsoft 365 Education)
    status: institutional
    published: true
    reason: >-
      Microsoft 365 Copilot Chat costs nothing extra when you sign in with a school
      account, but only if your institution holds an eligible Microsoft 365 Education
      licence (A1, A3 or A5) and an admin has switched it on. Neither is something
      you can claim yourself.
    detail: >-
      Microsoft confirmed in May 2025 that students aged 13 and over can use Copilot
      Chat once the school enables it. Note the scope: Education A1 does not include
      the consumer Copilot embedded in Word, Excel and PowerPoint, only the more
      limited Copilot Chat.
    check_path: >-
      Ask your school IT team whether the tenant holds an A1, A3 or A5 licence and
      whether Copilot Chat is enabled for student accounts.
    links:
      - 'https://learn.microsoft.com/en-us/copilot/manage'
      - 'https://www.microsoft.com/en-us/education/products/office'
    last_checked: '2026-08-18'
    confidence: high

  - id: canva
    name: Canva
    status: institutional
    published: true
    reason: >-
      Canva for Education is the eligibility-based K-12 offer. Higher-education
      access runs through Canva Campus, which the institution buys and manages.
      There is no individual higher-ed claim, so without a Campus licence a
      university student is on Canva Free.
    detail: >-
      One adjacent route exists. Canva opened Campus Canvassadors, a student
      ambassador programme for US university students, with its first cohort running
      August to December 2026. Applications are prioritised for students already at
      Canva for Campus schools, so it rewards existing access rather than creating it.
    check_path: Ask whether your school has procured Canva Campus.
    links:
      - 'https://www.canva.com/for-campus/'
      - 'https://www.canva.com/help/about-canva-for-campus/'
      - 'https://www.canva.com/help/about-canva-for-education/'
    last_checked: '2026-08-18'
    confidence: high

  - id: midjourney
    name: Midjourney
    status: none
    published: true
    reason: >-
      No individual student programme in 2026. The 20 percent saving on annual
      billing is available to everyone and is not a student discount.
    detail: >-
      Midjourney's educational-use policy is explicit that each student needs their
      own account and their own subscription. There are no shared accounts, no group
      plans and no way for a school to manage student accounts centrally, though
      schools can reimburse students directly.
