  - id: claude
    name: Claude (Anthropic)
    status: institutional
    published: true
    reason: >-
      No individual student discount on consumer pricing. Anthropic does not issue
      one-off discounts or coupons for Pro.
    detail: >-
      Access for students runs through Claude for Education, a university-wide plan
      licensed to the institution. Campus-wide agreements in place by mid-2026
      include Stanford, which rolled out to all students, faculty and staff from
      2026-06-30, plus Northeastern, the London School of Economics, Champlain
      College and Northumbria.
    individual_routes: >-
      The old self-serve Student Builder path (a form, a school email, roughly
      50 USD in API credit) is gone from Anthropic's site. It has been folded into
      the Claude Campus Program, which runs two application-gated tracks: Campus
      Ambassadors and Claude Builder Clubs. Both grant Claude Pro access plus
      unspecified API credits and a stipend, but neither publishes a dollar figure,
      and applications for the current cohort are CLOSED as of 2026-08-18. The
      External Researcher Access Program (around 1,000 USD in credit) remains a
      separate route. Outside those, the cheapest official option is Pro on annual
      billing at 17 USD per month, billed 200 USD up front, against 20 USD billed
      monthly.
    check_path: >-
      Ask your IT or procurement team whether your campus holds a Claude for
      Education agreement. If it does, signing in to claude.ai with your school
      email provisions the account at no cost to you.
    cli_note: >-
      Claude Code has no separate student offer. It is included with Pro and Max
      rather than sold on its own, so access follows whichever route above applies
      to you.
    links:
