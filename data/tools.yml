  - id: notion
    name: Notion
    offer: Education Plus
    category: Notes and knowledge
    tier: S
    status: active
    published: true
    daily_use: true
    rank: 1
    headline: Free
    blurb: >-
      The single best note and knowledge tool for grad school. Free Plus plan for a
      one-member workspace if you have an eligible school email. I run Notion as an
      operating system for my Product Management coursework and side projects.
    pricing:
      original: Plus is a paid tier for general users.
      student: Plus free for eligible students and educators, one-member workspace.
    features: >-
      Unlimited uploads, unlimited pages and blocks, 30-day page edit history,
      up to 100 guests.
    length: Continues while eligibility and school email status remain valid.
    verification: >-
      School email only. The school must be an accredited institution listed in the
      World Higher Education Database. Notion does not accept student IDs or other
      documentation.
    caveats:
      - >-
        Notion AI is NOT usefully included. As of 2026-08-18 there is no standalone
        AI add-on to buy. Free and Plus get trial-level AI only, and full AI
        (Agent, Meeting Notes, Enterprise Search) requires the Business tier at
        20 USD per member per month. Custom Agents are metered separately.
      - Requires a single-member workspace.
    referral:
      status: discontinued
      detail: >-
        The friend-referral programme was discontinued on 2020-05-19. Only the
        affiliate programme remains, and it is closed to new affiliates.
      links: ['https://www.notion.com/affiliates']
    links:
      - 'https://www.notion.com/help/notion-for-education'
      - 'https://www.notion.com/pricing'
