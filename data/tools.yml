        it, support.claude.com/en/articles/12184255-guest-passes, returns 404, and
        support.anthropic.com redirects there. If real, this is the most valuable
        programme on the list for this audience, so it is worth rechecking.
    - name: 'ChatGPT (OpenAI)'
      claim: 'Invite-only referral granting a free month of Plus.'
      why_unconfirmed: >-
        Described as a narrow pilot limited to specific universities in Australia
        and Colombia. No general programme found on OpenAI's own pages.
