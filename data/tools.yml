# for student discounts, so they never compete for a slot on the public list.
# Not re-verified in the 2026-08-18 pass.
# ---------------------------------------------------------------------------
referral_tools:
  audited: '2026-08-18'
  previous_audit: '2026-05-14'
  # Bar widened on 2026-08-18. It used to require a defined benefit for BOTH
  # parties, which rejected a whole class of real programmes. It now admits any
  # programme that pays EITHER party, with the `sided` field recording which.
  bar: >-
    An official vendor page must document a defined benefit to at least one party.
    `sided` records who actually benefits, so a referrer-only scheme is never
    presented as a mutual one. Affiliate programmes are included but labelled,
    because commission to the sharer is a different thing from a peer reward.
  sided_values: 'two-sided | referrer-only | referee-only | affiliate'
  coverage_note: >-
    Six entries were re-verified against vendor pages on 2026-08-18 and three new
    ones added. Runway, Krisp and Perplexity returned 403 to automated checks and
    Windsurf served an FAQ with no answers, so those keep their 2026-05-14 date
    and are NOT reconfirmed. Everything still dated 2026-05-14 below is carried
    over unverified.
  entries:
    - id: 'suno'
      name: 'Suno'
      category: 'Music'
      sided: 'two-sided'
      referrer: '250 credits per friend'
      referee: '250 credits'
      caveats: 'Confirmed in-product 2026-08-18 from the invite panel, which reads "When your friend signs up and creates 10 songs, you both receive 250 free credits. Limit of 2500 credits per person." Two corrections from that: the cap is 2,500 credits PER PERSON rather than per ten referrals, and the panel offers subscribing as an alternative rather than a prerequisite, so the earlier "referrer must be a paid member" note is dropped as unsupported. Invite links take the form suno.com/invite/@username. Referral credits persist rather than expiring daily.'
      link: 'https://suno.com/invite'
      confidence: 'high'
      last_checked: '2026-08-18'
    - id: 'raycast'
      name: 'Raycast'
      category: 'Productivity'
      sided: 'two-sided'
      referrer: '1 free month of Raycast Pro'
      referee: '1 free month of Raycast Pro'
      caveats: 'Referrer must be a Raycast Pro subscriber. Codes are shared through the Share Raycast command. Added 2026-08-18.'
      link: 'https://www.raycast.com/changelog/1-62-0'
      confidence: 'high'
      last_checked: '2026-08-18'
