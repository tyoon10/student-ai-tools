changelog:
  - date: '2026-08-18 (referral audit)'
    entries:
      - >-
        Suno and Granola confirmed from in-product panels, which is first-party
        evidence and outranks the help pages used before. Two corrections to Suno:
        the cap is 2,500 credits PER PERSON, not per ten referrals, and the earlier
        "referrer must be a paid member" note is dropped, since the panel offers
        subscribing as an alternative rather than a prerequisite.
      - >-
        Granola confirmed referee-only with its four rules: friend must be new,
        their company must have no existing workspace, signup must use a company
        email, and the trial extension applies automatically.
      - >-
        Added a cross-reference table for tracked tools that also run referral
        programmes. Without it the referral table omitted Granola, Perplexity,
        Otter and six others, and read as complete when it was not.
      - >-
        Widened the referral bar from "both parties must benefit" to "either party
        benefits", and added a `sided` field so a referrer-only scheme is never
        presented as mutual. 17 two-sided, 6 referrer-only, 3 affiliate.
      - >-
        Added Raycast (1 month each way), Recraft (200 credits each way) and
        Kling AI (500 credits to the sharer, 50 percent bonus to the friend).
      - >-
        Moved Descript, HeyGen, ElevenLabs, Synthesia and Decktopus in from
        ruled_out. All were rejected earlier only for being one-sided.
      - >-
        Reclassified Replit, v0, Gamma and Scite from two-sided to referrer-only.
        The friend never got more than a standard new-user grant in any of them.
      - >-
        Re-verified Suno, Fathom and Superhuman against vendor pages. Superhuman
        has a second route: signups via the "Sent via Superhuman" signature.
      - >-
        Perplexity: both referral routes are now closed. The Comet programme
