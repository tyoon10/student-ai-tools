# Single source of truth for the student-ai-tools guide.
#
# recommended.md and knowledge-base.md are BOTH generated from this file.
# Do not hand-edit those two files. Edit here, then run: python3 scripts/build.py
#
# status values:
#   active        offer is live and individually claimable today
#   ended         offer existed but is closed to new sign-ups (kept for the record)
#   institutional access exists only through a school/enterprise agreement
#   none          no student offer at all
#   unverified    could not confirm official terms; excluded from the public list
#
# referral.status values:
#   two-sided | asymmetric | campaign-gated | affiliate-only | b2b | discontinued | none | unclear

meta:
  last_full_review: '2026-08-18'
  previous_reviews: ['2026-07-19', '2026-05-14', '2026-05-03']
  live_post: 'https://twyoon.com/post/student-ai-tools/'
  repo: 'https://github.com/tyoon10/student-ai-tools'
  maintainer: 'Taewan Yoon'
  # Hard rule enforced by scripts/check_freshness.py
  max_age_days: 90
  affiliate_policy: >-
    This guide contains no affiliate or referral links. Every link goes to the
    vendor's own help-centre or pricing page. Referral programmes are documented
    as facts about each tool, not as an invitation to use anyone's link.

